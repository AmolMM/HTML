<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registraion</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form action="main.java">
        <input type="text" placeholder="Enter Name" name="name" id="nm" pattern="[a-zA-Z0-9]{3,8}">
        <input type="number" name="num" id="num" pattern="[0-9]{10}">
        <input type="email" name="email" id="em" placeholder="Enter EmialId" pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9]+\.[A-Za-z]{2,}"> 
        <button type="submit">Submit</button>
    </form>
</body>
</html>
